{% extends "admin/base.html" %}
{% block title %}Enter code{% endblock %}
{% block content %}
<h1 class="title">Check your email</h1>
<p class="muted">If {{ email }} is an admin address, a code is on its way. It expires in 10 minutes.</p>
<form method="post" class="card stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="code">Code</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required class="code-input"></div>
  <button class="button" type="submit">Sign in</button>
</form>
{% endblock %}
