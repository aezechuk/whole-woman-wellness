{% extends "base.html" %}
{% block title %}Reset your PIN{% endblock %}
{% block content %}
<h1 class="title">Set a new PIN</h1>
<p>We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in 10 minutes.</p>
<form method="post" class="card stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="code">Code from the email</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9 ]*" maxlength="7" required class="code-input">
  </div>
  <div class="field">
    <label for="pin">New PIN <span class="muted small">(4 to 6 numbers)</span></label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6"
           autocomplete="off" required class="code-input">
  </div>
  <div class="field">
    <label for="confirm">Type it again</label>
    <input id="confirm" name="confirm" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6"
           autocomplete="off" required class="code-input">
  </div>
  <button class="button" type="submit">Save new PIN</button>
</form>
<form method="post" action="{{ url_for('reflect.pin_forgot') }}" class="center">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="link-button center" type="submit">Send a new code</button>
</form>
{% endblock %}
