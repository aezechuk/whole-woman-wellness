<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px 12px;background:#FBF5F2;font-family:Montserrat,Helvetica,Arial,sans-serif;color:#2A1230">
  <div style="max-width:520px;margin:0 auto;background:#FFFFFF;border-radius:16px;overflow:hidden">
    <div style="background:#4B0F4F;padding:18px 24px;color:#F3D9F7;font-size:12px;font-weight:600;letter-spacing:.12em">RADICAL SELF-CARE RESET</div>
    <div style="padding:24px;font-size:15px;line-height:1.55">
      {% block body %}{% endblock %}
    </div>
  </div>
  <p style="max-width:520px;margin:16px auto 0;font-size:12px;line-height:1.5;color:#6B5670;text-align:center">
    Radical Self-Care Reset · Whole Woman Wellness Initiative<br>
    Women in Arts (WiARTS) · Arthentic<br>
    Supported by {{ funder_name }}<br>
    Questions? <a href="mailto:{{ contact_email }}" style="color:#8A2A66">{{ contact_email }}</a>
    {% block footer_extra %}{% endblock %}
  </p>
</body>
</html>
