# Production stack on one EC2 instance. Only Caddy is reachable from outside (80/443).
# Secrets come from /opt/wellness/.env, written at boot from SSM Parameter Store (root-only, 0600).
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_HOST: ${SITE_HOST:-wellness.arthenticarts.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  app:
    image: wellness-app:latest
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: /opt/wellness/.env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://wellness:${POSTGRES_PASSWORD}@db:5432/wellness
      AWS_DEFAULT_REGION: us-east-2
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellness
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness -d wellness"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    # No ports published: the database is reachable only from the app container.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
